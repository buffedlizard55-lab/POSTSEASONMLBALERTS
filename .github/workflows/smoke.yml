name: API smoke test

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  schedule:
    # nightly sanity check that the upstream data still matches our parsers
    - cron: '17 4 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate two-sided hit forecast model
        run: node tools/hit-model-test.mjs

      - name: Validate challenges and replay reviews
        run: node tools/review-test.mjs

      - name: Validate all-games replay feed diff helpers
        run: node tools/reviews-feed-test.mjs

      # The alert sound. Two steps, because the two halves have different
      # dependency profiles:
      #   - sound-lab-page-test.mjs has NO dependencies (it statically checks
      #     the Sound Lab page against the module, the server and the measuring
      #     tool), so it runs unconditionally and must pass.
      #   - render-alert-sound.mjs needs web-audio-engine, which is deliberately
      #     not a dependency of a site that ships with no build step. If it
      #     cannot be installed the tool prints that it is skipping and exits 0,
      #     so CI degrades to the structure test instead of failing on network.
      #     When it IS available, a failing measurement fails the build.
      - name: Validate the Sound Lab page against the module, the server and the measuring tool
        run: node tools/sound-lab-page-test.mjs

      - name: Render the alert sound and re-measure it with independent code
        run: |
          npm install --no-save web-audio-engine \
            || echo "::warning::web-audio-engine could not be installed - the rendered-PCM checks will report themselves skipped"
          node tools/render-alert-sound.mjs alert-sound.wav
          if [ -f alert-sound.wav ]; then
            node tools/alert-sound-independent-check.mjs alert-sound.wav
          else
            echo "no render was produced, so there is nothing to re-measure independently"
          fi

      - name: Render all-games replay feed against captured API payloads
        run: node tools/replay-feed-render-test.mjs

      - name: Validate in-review lean probe signature
        run: node tools/review-probe-test.mjs

      - name: Validate official game-status review detection
        run: node tools/review-status-test.mjs

      - name: Validate the replay feed review-status watcher
        run: node tools/review-watcher-test.mjs

      - name: Validate official scoring-change tracker
        run: node tools/scoring-change-test.mjs

      - name: Validate official-scorer pending rulings
        run: node tools/official-scoring-test.mjs

      - name: Validate feed-log persistence
        run: node tools/feed-log-persistence-test.mjs

      - name: Run smoke test against live MLB StatsAPI
        run: node tools/smoke-test.mjs
